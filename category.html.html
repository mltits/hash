<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAU Store - Category</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/product-card.js"></script>
    <script src="category-products.js"></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    
    <!-- Category Header -->
    <section id="category-header" class="bg-gradient-to-r from-blue-600 to-purple-700 text-white py-12">
        <div class="container mx-auto px-4">
            <div class="flex items-center mb-4">
                <a href="index.html" class="text-white/80 hover:text-white mr-2">Home</a>
                <i data-feather="chevron-right" class="w-4 h-4 mx-2"></i>
                <span id="category-title" class="font-semibold">Category</span>
            </div>
            <h1 id="category-name" class="text-4xl md:text-5xl font-bold mb-4">Category Name</h1>
            <p id="category-description" class="text-xl">Browse our collection of products in this category</p>
        </div>
    </section>

    <main class="container mx-auto px-4 py-8">
        <!-- Filter & Sort Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div class="text-gray-600">
                <span id="product-count">0</span> products found
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <!-- Filter Button (Mobile) -->
                <button id="filter-toggle" class="md:hidden bg-white border border-gray-300 px-4 py-2 rounded-lg flex items-center justify-center">
                    <i data-feather="filter" class="w-4 h-4 mr-2"></i>
                    Filters
                </button>
                
                <!-- Sort Dropdown -->
                <div class="relative">
                    <select id="sort-select" class="bg-white border border-gray-300 px-4 py-2 rounded-lg w-full md:w-auto">
                        <option value="featured">Sort by: Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Customer Rating</option>
                        <option value="newest">Newest Arrivals</option>
                        <option value="best-selling">Best Selling</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-8">
            <!-- Filters Sidebar -->
            <aside id="filters-sidebar" class="md:w-1/4 lg:w-1/5">
                <div class="bg-white rounded-lg shadow-sm p-6 sticky top-24">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-bold text-lg">Filters</h3>
                        <button id="clear-filters" class="text-blue-600 text-sm">Clear all</button>
                    </div>
                    
                    <!-- Price Range -->
                    <div class="mb-6">
                        <h4 class="font-semibold mb-3">Price Range</h4>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="price" value="0-100">
                                <span>Under $100</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="price" value="100-500">
                                <span>$100 - $500</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="price" value="500-1000">
                                <span>$500 - $1000</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="price" value="1000+">
                                <span>Over $1000</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Brands -->
                    <div class="mb-6">
                        <h4 class="font-semibold mb-3">Brands</h4>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="brand" value="apple">
                                <span>Apple</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="brand" value="samsung">
                                <span>Samsung</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="brand" value="dell">
                                <span>Dell</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="brand" value="sony">
                                <span>Sony</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Rating -->
                    <div class="mb-6">
                        <h4 class="font-semibold mb-3">Rating</h4>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="rating" value="4+">
                                <span class="flex items-center">
                                    <i data-feather="star" class="w-4 h-4 text-yellow-400 fill-current mr-1"></i>
                                    4+ & above
                                </span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2" data-filter="rating" value="3+">
                                <span class="flex items-center">
                                    <i data-feather="star" class="w-4 h-4 text-yellow-400 fill-current mr-1"></i>
                                    3+ & above
                                </span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Deals -->
                    <div>
                        <label class="flex items-center">
                            <input type="checkbox" class="mr-2" data-filter="deal" value="true">
                            <span class="text-red-600 font-medium">On Sale</span>
                        </label>
                    </div>
                </div>
            </aside>

            <!-- Products Grid -->
            <div class="md:w-3/4 lg:w-4/5">
                <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Products will be loaded dynamically -->
                </div>
                
                <!-- Loading State -->
                <div id="loading" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-4"></div>
                    <p>Loading products...</p>
                </div>
                
                <!-- No Results -->
                <div id="no-results" class="text-center py-12 hidden">
                    <i data-feather="search" class="w-12 h-12 text-gray-400 mx-auto mb-4"></i>
                    <h3 class="text-xl font-semibold text-gray-600 mb-2">No products found</h3>
                    <p class="text-gray-500">Try adjusting your filters or search again</p>
                </div>
                
                <!-- Load More Button -->
                <div id="load-more-container" class="text-center mt-12 hidden">
                    <button id="load-more" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 font-medium">
                        Load More Products
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Category Description -->
        <div id="category-info" class="mt-12 bg-white rounded-lg shadow-sm p-8">
            <h2 class="text-2xl font-bold mb-4" id="info-title"></h2>
            <div id="info-content" class="prose max-w-none"></div>
        </div>
    </main>
    
    <custom-footer></custom-footer>
    
    <script>
        feather.replace();
        setInterval(() => feather.replace(), 1000);
        
        // Mobile filters toggle
        document.getElementById('filter-toggle')?.addEventListener('click', () => {
            const sidebar = document.getElementById('filters-sidebar');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('block');
        });
        
        // Get category from URL
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('category') || 'phones';
    </script>
</body>
</html>
